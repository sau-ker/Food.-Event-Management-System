<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quick POS - เทศกาลอาหาร</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/dexie@latest/dist/dexie.js"></script>
</head>
<body class="bg-gray-100 font-sans h-screen overflow-hidden flex flex-col select-none">

    <header class="bg-slate-800 text-white px-6 py-3 flex justify-between items-center shadow-md">
        <h1 class="text-xl font-bold tracking-wide">🎪 Fast POS For Event</h1>
        <div id="net-status" class="px-4 py-1.5 rounded-full text-sm font-semibold flex items-center gap-2 bg-green-500">
            <span class="h-2.5 w-2.5 rounded-full bg-white animate-pulse"></span>
            ออนไลน์ (Google Sheets พร้อม)
        </div>
    </header>

    <main class="flex-1 flex overflow-hidden">
        
        <section class="w-3/5 p-4 overflow-y-auto grid grid-cols-2 gap-4 content-start">
            <button onclick="addToCart('ข้าวผัดปู', 80)" class="bg-white hover:bg-orange-50 active:scale-95 border-2 border-gray-200 rounded-2xl p-6 text-center shadow-sm flex flex-col justify-between h-40 transition-all">
                <span class="text-2xl font-bold text-gray-800 block">🦀 ข้าวผัดปู</span>
                <span class="text-xl font-extrabold text-orange-600 block bg-orange-50 rounded-lg py-1">80 ฿</span>
            </button>
            <button onclick="addToCart('ต้มยำกุ้ง', 150)" class="bg-white hover:bg-orange-50 active:scale-95 border-2 border-gray-200 rounded-2xl p-6 text-center shadow-sm flex flex-col justify-between h-40 transition-all">
                <span class="text-2xl font-bold text-gray-800 block">🦐 ต้มยำกุ้ง</span>
                <span class="text-xl font-extrabold text-orange-600 block bg-orange-50 rounded-lg py-1">150 ฿</span>
            </button>
            <button onclick="addToCart('ไก่ทอด', 60)" class="bg-white hover:bg-orange-50 active:scale-95 border-2 border-gray-200 rounded-2xl p-6 text-center shadow-sm flex flex-col justify-between h-40 transition-all">
                <span class="text-2xl font-bold text-gray-800 block">🍗 ไก่ทอดหาดใหญ่</span>
                <span class="text-xl font-extrabold text-orange-600 block bg-orange-50 rounded-lg py-1">60 ฿</span>
            </button>
            <button onclick="addToCart('น้ำดื่ม', 15)" class="bg-white hover:bg-orange-50 active:scale-95 border-2 border-gray-200 rounded-2xl p-6 text-center shadow-sm flex flex-col justify-between h-40 transition-all">
                <span class="text-2xl font-bold text-gray-800 block">🥤 น้ำดื่ม + น้ำแข็ง</span>
                <span class="text-xl font-extrabold text-orange-600 block bg-orange-50 rounded-lg py-1">15 ฿</span>
            </button>
        </section>

        <section class="w-2/5 bg-white border-l border-gray-200 flex flex-col justify-between shadow-xl">
            <div class="p-6 flex-1 overflow-y-auto">
                <h2 class="text-lg font-bold text-gray-700 border-b pb-3 mb-4 flex justify-between">
                    <span>รายการปัจจุบัน</span>
                    <button onclick="clearCart()" class="text-sm font-normal text-red-500 hover:underline">ล้างทั้งหมด</button>
                </h2>
                <div id="cart-items" class="space-y-4 text-lg">
                    <p class="text-gray-400 text-center py-10">ยังไม่มีรายการอาหาร</p>
                </div>
            </div>

            <div class="p-6 bg-gray-50 border-t border-gray-200 space-y-4">
                <div class="flex justify-between items-center">
                    <span class="text-xl font-bold text-gray-600">ยอดรวมทั้งสิ้น:</span>
                    <span id="total-price" class="text-4xl font-black text-slate-800">0 ฿</span>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <button onclick="checkout('Cash')" class="bg-green-600 hover:bg-green-700 active:scale-95 text-white font-bold text-xl py-5 rounded-2xl shadow-md transition-all flex flex-col items-center justify-center">
                        💵 เงินสดพอดี
                    </button>
                    <button onclick="checkout('Transfer')" class="bg-blue-600 hover:bg-blue-700 active:scale-95 text-white font-bold text-xl py-5 rounded-2xl shadow-md transition-all flex flex-col items-center justify-center">
                        📱 เงินโอน / QR
                    </button>
                </div>
            </div>
        </section>
    </main>

    <script>
        // ⚠️ วาง URL ของ Google Apps Script ที่ก๊อปปี้มาไว้ที่นี่ครับ
        const BACKEND_URL = "https://script.google.com/macros/s/AKfycbx0tqwfF7c6jKjy6x8e_XicKUDjPpPP_gpoQKREhgviLf6lnIIGS2KFKDJNQSmaE40/exec";

        // 1. ตั้งค่าฐานข้อมูลออฟไลน์ในเครื่อง (IndexedDB ผ่าน Dexie.js)
        const db = new Dexie("POS_Database");
        db.version(1).stores({
            orders: 'order_id, order_timestamp, items_summary, total_amount, payment_method, synced'
        });

        // ขอสิทธิ์ iOS ไม่ให้ลบข้อมูลแคชของแอปนี้ในเครื่อง
        if (navigator.storage && navigator.storage.persist) {
            navigator.storage.persist();
        }

        let cart = {};
        let total = 0;

        // ฟังก์ชันเพิ่มอาหารลงตะกร้า
        function addToCart(name, price) {
            if (cart[name]) {
                cart[name].qty += 1;
            } else {
                cart[name] = { price: price, qty: 1 };
            }
            updateUI();
        }

        // ฟังก์ชันเคลียร์ตะกร้า
        function clearCart() {
            cart = {};
            updateUI();
        }

        // ฟังก์ชันอัปเดตหน้าจอสรุปราคา
        function updateUI() {
            const container = document.getElementById('cart-items');
            const totalEl = document.getElementById('total-price');
            container.innerHTML = '';
            total = 0;

            const items = Object.keys(cart);
            if (items.length === 0) {
                container.innerHTML = '<p class="text-gray-400 text-center py-10">ยังไม่มีรายการอาหาร</p>';
                totalEl.innerText = '0 ฿';
                return;
            }

            items.forEach(name => {
                const itemTotal = cart[name].price * cart[name].qty;
                total += itemTotal;
                container.innerHTML += `
                    <div class="flex justify-between items-center bg-white p-3 rounded-xl border border-gray-100 shadow-sm">
                        <div>
                            <span class="font-bold text-gray-800">${name}</span>
                            <span class="text-sm text-gray-500 block">ราคา ${cart[name].price} ฿</span>
                        </div>
                        <div class="font-extrabold text-slate-700">x ${cart[name].qty} (${itemTotal} ฿)</div>
                    </div>
                `;
            });
            totalEl.innerText = total + ' ฿';
        }

        // 2. ฟังก์ชันกดคิดเงินทันที (บันทึกออฟไลน์ลงเครื่องทันทีก่อนเป็นอันดับแรก)
        async function checkout(method) {
            if (total === 0) return alert("กรุณาเลือกรายการอาหารก่อนครับ");

            // สร้างสรุปรายการอาหารเป็นข้อความตัวหนังสือ
            const summary = Object.keys(cart).map(name => `${name} (${cart[name].qty})`).join(', ');
            
            // สร้าง Order ID จากเวลาในเครื่อง
            const now = new Date();
            const orderId = "POS-" + now.getFullYear() + String(now.getMonth()+1).padStart(2,'0') + String(now.getDate()).padStart(2,'0') + "-" + now.getTime();
            
            // ข้อมูลที่จะทำการบันทึก
            const orderData = {
                order_id: orderId,
                order_timestamp: now.toLocaleString('th-TH'),
                items_summary: summary,
                total_amount: total,
                payment_method: method,
                synced: 0 // 0 = ยังไม่ได้ซิงค์ขึ้น Google Sheets
            };

            try {
                // บันทึกลงฐานข้อมูลในเครื่อง iPad ทันที (Offline-First)
                await db.orders.add(orderData);
                
                // เสียง/แจ้งเตือนคิดเงินสำเร็จและเคลียร์หน้าจอรับลูกค้ารายต่อไปทันทีภายในเสี้ยววินาที
                cart = {};
                updateUI();
                
                // เรียกให้ระบบพยายามซิงค์ข้อมูลขึ้น Google Sheets แบบเบื้องหลังทันที
                syncDataWithCloud();
                
            } catch (err) {
                alert("เกิดข้อผิดพลาดในการบันทึกข้อมูลในเครื่อง: " + err);
            }
        }

        // 3. กลไกการ Auto-Sync ส่งข้อมูลขึ้น Google Sheets เมื่อมีเน็ต
        let isSyncing = false;
        async function syncDataWithCloud() {
            if (isSyncing || !navigator.onLine) return;
            isSyncing = true;

            // ค้นหาออเดอร์ในเครื่องที่ยังไม่ได้ซิงค์ (synced == 0)
            const unSyncedOrders = await db.orders.where('synced').equals(0).toArray();

            for (let order of unSyncedOrders) {
                try {
                    // ส่งข้อมูลไปที่ Google Apps Script API
                    const response = await fetch(BACKEND_URL, {
                        method: 'POST',
                        mode: 'no-cors', // ตั้งค่าเพื่อป้องกันปัญหาบล็อก CORS ข้ามโดเมน
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(order)
                    });

                    // เนื่องจากโหมด no-cors จะอ่าน response ตรงๆ ไม่ได้ 
                    // แต่ถ้าส่งผ่านไปถึง Google Sheets ได้สำเร็จตามกระบวนการ ให้ปรับสถานะออเดอร์นั้นในเครื่องทันที
                    await db.orders.update(order.order_id, { synced: 1 });
                    console.log(`ซิงค์สำเร็จ: ${order.order_id}`);

                } catch (error) {
                    console.error("การซิงค์ติดขัด (เน็ตอาจจะหลุดอีกครั้ง): ", error);
                    break; // หยุดซิงค์รายการที่เหลือชั่วคราว รอเน็ตมาใหม่
                }
            }
            isSyncing = false;
        }

        // 4. ระบบตรวจจับและคอยเฝ้าดูสัญญาณเน็ต (Network Monitor)
        function updateNetworkStatus() {
            const statusEl = document.getElementById('net-status');
            if (navigator.onLine) {
                statusEl.innerText = "ออนไลน์ (Google Sheets พร้อม)";
                statusEl.className = "px-4 py-1.5 rounded-full text-sm font-semibold flex items-center gap-2 bg-green-500 text-white";
                syncDataWithCloud(); // เมื่อเน็ตกลับมามาให้เปิดใช้งานฟังก์ชันซิงค์อัตโนมัติย้อนหลังทันที
            } else {
                statusEl.innerText = "กำลังออฟไลน์ (เก็บข้อมูลในเครื่องแทน)";
                statusEl.className = "px-4 py-1.5 rounded-full text-sm font-semibold flex items-center gap-2 bg-amber-500 text-white";
            }
        }

        // ผูกตัวคอยจับสัญญาณเน็ตเข้ากับ Browser เมื่อสลับโหมดออนไลน์/ออฟไลน์
        window.addEventListener('online', updateNetworkStatus);
        window.addEventListener('offline', updateNetworkStatus);
        
        // รันครั้งแรกตอนเปิดแอป
        updateNetworkStatus();
        // ตรวจสอบข้อมูลตกค้างเพื่อลองซิงค์ใหม่ทุกๆ 30 วินาที
        setInterval(syncDataWithCloud, 30000);
    </script>
</body>
</html>
